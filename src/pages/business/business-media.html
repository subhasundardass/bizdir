<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo <title>Login — JustDial Clone</title> photos — JustDial Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-alt antialiased">
  <main class="mx-auto max-w-5xl px-4 pt-8 sm:px-6">
    <p class="text-xs font-bold uppercase tracking-widest text-jd-orange">Step 3 of 6</p>
    <h1 class="mt-1 text-2xl font-bold tracking-tight text-ink sm:text-3xl">Add your logo and photos</h1>
    <p class="mt-2 max-w-2xl text-sm leading-6 text-secondary">Listings with clear photos get noticeably more calls and visits.</p>
    <div id="banner" class="mt-4" hidden></div>

    <section class="card mt-6" aria-labelledby="h-logo">
      <h2 id="h-logo" class="text-base font-bold text-ink">Business logo</h2>
      <p class="mt-1 text-xs text-secondary">JPG, PNG or WEBP · Square image, at least 400 × 400 px · Max 2 MB</p>
      <div class="mt-4 grid gap-5 sm:grid-cols-[1fr_auto] sm:items-center">
        <div id="logoDrop" class="drop" role="button" tabindex="0" aria-label="Upload logo"></div>
        <div id="logoPreview" class="hidden items-center gap-4 rounded-2xl border border-line p-3">
          <img id="logoImg" alt="Business logo preview" class="h-24 w-24 rounded-xl border border-line object-cover" />
          <div class="min-w-0"><p id="logoName" class="max-w-[180px] truncate text-sm font-semibold text-ink"></p>
            <div class="mt-2 flex gap-2"><button type="button" id="logoReplace" class="btn btn-outline !min-h-9 !px-3 text-xs">Replace</button><button type="button" id="logoRemove" class="btn btn-ghost !min-h-9 !px-3 text-xs">Remove</button></div></div>
        </div>
      </div>
      <input type="file" id="logoInput" name="logo" accept="image/jpeg,image/png,image/webp" class="sr-only" tabindex="-1" />
      <p id="logoErr" class="err" role="alert"></p>
    </section>

    <section class="card mt-6" aria-labelledby="h-photos">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div><h2 id="h-photos" class="text-base font-bold text-ink">Business photos</h2>
          <p class="mt-1 text-xs text-secondary">JPG, PNG or WEBP · Up to 10 photos · Max 5 MB each</p></div>
        <span id="count" class="rounded-full bg-jd-light px-3 py-1 text-xs font-semibold text-jd-orange">0 / 10</span>
      </div>
      <div id="photoDrop" class="drop mt-4" role="button" tabindex="0" aria-label="Upload photos"></div>
      <input type="file" id="photoInput" name="photos" multiple accept="image/jpeg,image/png,image/webp" class="sr-only" tabindex="-1" />
      <p id="photoErr" class="err" role="alert"></p>
      <ul id="grid" class="mt-4 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4"></ul>
    </section>
    <div class="flex flex-col-reverse gap-3 py-6 sm:flex-row sm:items-center sm:justify-between">
        <a href="business-information.html" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i>Back</a>
        <div class="flex flex-col-reverse gap-3 sm:flex-row"><button type="button" id="draft" class="btn btn-outline">Save as draft</button><button type="button" id="next" class="btn btn-primary">Save &amp; continue</button></div></div>
  </main>
  <script src="js/app.js"></script>
  <script>
    JD.init(3);
    const A = ["image/jpeg", "image/png", "image/webp"], L = "JPG, PNG or WEBP", MAX = 10;
    const $ = id => document.getElementById(id), banner = $("banner");
    let logo = null, photos = []; // photos: { id, name, url, caption, cover }
    // INTEGRATION POINT: after each pick, upload the File to your API and store the returned URL.

    const drawLogo = () => {
      $("logoDrop").innerHTML = JD.dropHTML("fa-image", "Upload logo", "Drag &amp; drop or <u>browse</u>");
      $("logoDrop").classList.toggle("hidden", !!logo); $("logoPreview").classList.toggle("hidden", !logo); $("logoPreview").classList.toggle("flex", !!logo);
      if (logo) { $("logoImg").src = logo.url; $("logoName").textContent = logo.name; }
    };
    JD.picker({ zone: $("logoDrop"), input: $("logoInput"), accept: A, maxMB: 2, label: L, onError: m => $("logoErr").textContent = m,
      onFiles: async f => { $("logoErr").textContent = ""; logo = { name: f[0].name, url: await JD.readURL(f[0]) }; drawLogo(); } });
    $("logoReplace").onclick = () => $("logoInput").click();
    $("logoRemove").onclick = () => { logo = null; drawLogo(); };

    const drawPhotos = () => {
      $("count").textContent = photos.length + " / " + MAX;
      $("photoDrop").innerHTML = JD.dropHTML("fa-images", photos.length ? "Add more photos" : "Upload photos", "Drag &amp; drop or <u>browse</u> · " + (MAX - photos.length) + " left");
      $("grid").innerHTML = photos.map(p => '<li class="overflow-hidden rounded-2xl border border-line bg-white" data-id="' + p.id + '"><div class="relative">' +
        '<img src="' + p.url + '" alt="' + JD.esc(p.caption || p.name) + '" class="aspect-[4/3] w-full object-cover" />' +
        (p.cover ? '<span class="absolute left-2 top-2 rounded-full bg-jd-orange px-2.5 py-1 text-[10px] font-bold text-white">Cover</span>' : "") +
        '<button type="button" data-act="del" aria-label="Remove ' + JD.esc(p.name) + '" class="absolute right-2 top-2 flex h-7 w-7 items-center justify-center rounded-full bg-white/95 text-secondary shadow-sm hover:text-danger"><i class="fa-solid fa-xmark"></i></button></div>' +
        '<div class="space-y-2 p-3"><label class="sr-only" for="cap' + p.id + '">Caption</label><input id="cap' + p.id + '" data-act="cap" class="field !min-h-9 !py-1.5 text-xs" placeholder="Add a caption" maxlength="80" value="' + JD.esc(p.caption) + '" />' +
        '<button type="button" data-act="cover" class="text-xs font-semibold ' + (p.cover ? "text-muted" : "text-jd-orange hover:text-jd-hover") + '"' + (p.cover ? " disabled" : "") + '>' + (p.cover ? "Cover photo" : "Set as cover photo") + '</button></div></li>').join("");
    };
    JD.picker({ zone: $("photoDrop"), input: $("photoInput"), accept: A, maxMB: 5, multiple: true, label: L, onError: m => $("photoErr").textContent = m,
      onFiles: async files => { $("photoErr").textContent = "";
        for (const f of files) { if (photos.length >= MAX) { $("photoErr").textContent = "You can add up to " + MAX + " photos."; break; }
          photos.push({ id: Date.now() + Math.random().toString(36).slice(2, 6), name: f.name, url: await JD.readURL(f), caption: "", cover: !photos.length }); }
        drawPhotos(); } });
    $("grid").addEventListener("click", e => {
      const b = e.target.closest("[data-act]"); if (!b) return; const id = b.closest("li").dataset.id;
      if (b.dataset.act === "del") { const was = photos.find(p => p.id === id).cover; photos = photos.filter(p => p.id !== id); if (was && photos[0]) photos[0].cover = true; drawPhotos(); }
      if (b.dataset.act === "cover") { photos.forEach(p => p.cover = p.id === id); drawPhotos(); }
    });
    $("grid").addEventListener("input", e => { if (e.target.dataset.act === "cap") photos.find(p => p.id === e.target.closest("li").dataset.id).caption = e.target.value; });

    // Only file names and captions are kept as a draft; image data isn't persisted.
    const save = () => JD.store.set("media", { logo: logo && logo.name, photos: photos.map(p => ({ name: p.name, caption: p.caption, cover: p.cover })) });
    $("draft").onclick = () => { save(); JD.banner(banner, "success", "Draft saved."); scrollTo({ top: 0, behavior: "smooth" }); };
    $("next").onclick = () => {
      if (!logo) { $("logoErr").textContent = "Add a logo to continue, or save as draft to finish later."; $("logoDrop").focus(); return; }
      save(); JD.markDone(3); location.href = "business-certifications.html";
    };
    drawLogo(); drawPhotos();
  </script>
</body>
</html>
